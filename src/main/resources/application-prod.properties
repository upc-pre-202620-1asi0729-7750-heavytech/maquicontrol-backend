# Production profile
# Read database settings from environment variables expected in Docker/runtime.
spring.datasource.url=jdbc:mysql://${DATABASE_URL}:${DATABASE_PORT:3306}/${DATABASE_NAME}?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=false&publicKeyRetrieval=true
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Production-lean JPA behavior. The schema is created or updated on startup unless JPA_DDL_AUTO says otherwise.
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# App port
server.port=${PORT:8080}

# The cloud platform terminates HTTPS in front of the app; trust its forwarded headers.
server.forward-headers-strategy=framework

# JWT secret must be provided as an environment variable in production.
authorization.jwt.secret=${JWT_SECRET}
