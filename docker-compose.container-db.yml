services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=maquicontrol
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure:5
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_URL=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=maquicontrol
      - DATABASE_USER=root
      - DATABASE_PASSWORD=password
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
