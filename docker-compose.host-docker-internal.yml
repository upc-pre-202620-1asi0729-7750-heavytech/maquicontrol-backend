services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_URL=host.docker.internal
      - DATABASE_PORT=3306
      - DATABASE_NAME=maquicontrol
      - DATABASE_USER=root
      - DATABASE_PASSWORD=password
    extra_hosts:
      - "host.docker.internal:host-gateway"
