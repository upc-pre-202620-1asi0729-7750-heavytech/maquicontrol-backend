name: Build and deploy backend to Azure Web App

# Deploys the RESTful Web Services to Azure App Service on every release to main
# (GitFlow), and on demand from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: maquicontrol-backend   # Azure App Service name
  JAVA_VERSION: '21'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run unit tests
        # The contextLoads test needs a real MySQL, so it is excluded from CI.
        run: |
          chmod +x mvnw
          ./mvnw -B package -Dtest='!MaquicontrolBackendApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: target/*.jar
